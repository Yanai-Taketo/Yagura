# TLS 暗号スイートの実測（ADR-0024 委任事項 1 の残条件 B。Issue #494）
#
# ■ 何を測るか
# **OS（Schannel）が既定で有効にしている TLS 暗号スイートの集合**を、推奨環境の各
# バージョンで採取する。Yagura が固定しているのは**プロトコル版の下限（TLS 1.2）だけ**で、
# ハンドシェイクで実際に選ばれるスイートは OS のポリシーに委ねられている——したがって
# 「対応環境と推奨環境で通信強度に差があるか」は、Yagura を動かして 1 回ハンドシェイクを
# 見ても分からない。**OS の既定集合そのものを並べる**しかない。
#
# ■ なぜ CI で測るのか（lab ではなく）
# 測定対象は Yagura の挙動ではなく **OS の設定**である。GitHub ホストランナーの Windows
# image はその OS の既定を持っているため、推奨環境 2 バージョンの採取はここで足りる。
# 対応下限の Server 2019 は `windows-2019` ランナーが退役済みで CI では踏めないため、
# lab の実測値を installer/lab/server2019-support-validation-procedure.md §A-4 に記録して
# あり、本 workflow の出力とそれを突き合わせる。
#
# ■ トリガ設計（常設にしない）
# 毎 PR で回す価値はない——Yagura のコード変更で結果が変わることはないため。
#   - workflow_dispatch: 再測したくなったとき（ランナー image の更新後・監査対応等）
#   - push（本ファイル自身の変更時のみ）: 採取内容を変えたら測り直す、が自然に成立する
# ランナー image の更新で結果は変わりうるが、**変わっても Yagura 側の記述は変わらない**
# （「強度は OS 側の設定に依存する」という命題は集合の中身に依らない）。したがって
# 追随を自動化する必要はなく、必要になった時点で dispatch すればよい。
name: TLS Cipher Suite Survey

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tls-cipher-suite-survey.yml'

permissions:
  contents: read

jobs:
  survey:
    strategy:
      # 片方が落ちてももう片方の採取は続ける（比較が目的のため両方欲しいが、
      # 片方だけでも 2019 との突合はできる）。
      fail-fast: false
      matrix:
        # 推奨環境（ADR-0024 決定 1）。ci.yml の matrix と同じ明示ピンにする。
        os: [windows-2025, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      # 採取値は「どの OS ビルドの既定か」とセットでなければ記録として意味を持たない
      # （ランナー image は随時更新されるため）。
      - name: Record OS identity
        shell: pwsh
        run: |
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          [pscustomobject]@{
            RunnerLabel  = '${{ matrix.os }}'
            ProductName  = $cv.ProductName
            DisplayVersion = $cv.DisplayVersion
            BuildNumber  = "$($cv.CurrentMajorVersionNumber).$($cv.CurrentMinorVersionNumber).$($cv.CurrentBuildNumber).$($cv.UBR)"
            OSVersion    = [System.Environment]::OSVersion.VersionString
          } | Format-List

      # ■ 採取ステップは Windows PowerShell 5.1 で、**スクリプト本体は ASCII のみ**にする
      #
      # (1) なぜ 5.1 か: `Get-TlsCipherSuite` は Windows 同梱の TLS モジュール（CDXML）で、
      #     pwsh 7 からは Windows PowerShell 互換層を経由する。その際に**全スイートが
      #     1 オブジェクトへ潰れ、各プロパティが配列になる**（実測: `$suites.Count` が 1 に
      #     なり、Name が `{TLS_AES_256_GCM_SHA384, TLS_AES_128_GCM_SHA256, ...}` として返る）。
      #     例外は出ないため、後段の絞り込みが黙って 0 件を返す——**「弱いスイートは無い」
      #     という誤った結論が緑のまま記録される**。下の件数ガードはこの再発を落とすためにある。
      #     5.1 を使うことで lab（Server 2019）の採取方法とも揃う。
      # (2) なぜ ASCII のみか: en-US ランナーの Windows PowerShell 5.1 は `run:` が生成する
      #     .ps1 を UTF-8 として読まず、**日本語を含むとパースエラーで落ちる**
      #     （installer-e2e.yml が記録している同種の制約と同じ原因）。したがって説明は
      #     すべて本 YAML コメント側に置き、スクリプト内の文字列・コメントは ASCII に限る。
      # (3) `Protocols` は UInt32 の配列で返る（0x0303 = TLS 1.2 / 0x0304 = TLS 1.3）。
      #     既定の表示では配列が省略されて比較に使えないため 16 進へ展開する。
      #     DTLS（0xFEFF / 0xFEFD）は本件の対象外だが、除外して集合を歪めないようそのまま出す。
      # (4) 弱いスイートの判定は**名前**で行う——`CipherLength` だけでは 3DES（168）と
      #     AES（128/256）の別が読みにくく、NULL（暗号化なし）は長さ 0 で他と紛れるため。
      - name: Collect enabled TLS cipher suites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $suites = Get-TlsCipherSuite | ForEach-Object {
            [pscustomobject]@{
              Name         = $_.Name
              Protocols    = ($_.Protocols | ForEach-Object { '0x{0:X4}' -f $_ }) -join ','
              Cipher       = $_.Cipher
              CipherLength = $_.CipherLength
              Hash         = $_.Hash
              Exchange     = $_.Exchange
            }
          }

          Write-Host "Enabled cipher suites: $($suites.Count)"

          # Guard: see YAML comment (1). A collapsed result yields a silent, wrong "0 weak".
          if ($suites.Count -lt 10) {
            throw "Cipher suite collection failed ($($suites.Count) found). Get-TlsCipherSuite may have collapsed into a single object; this step must run under Windows PowerShell 5.1."
          }

          $suites | Format-Table -AutoSize | Out-String -Width 200 | Write-Host

          # Weak suites: 3DES / NULL / RC4 / SHA-1 CBC (name ends with _CBC_SHA).
          $weak = $suites | Where-Object {
            $_.Name -match '3DES' -or $_.Name -match 'NULL' -or $_.Name -match 'RC4' -or
            $_.Name -match 'CBC_SHA$'
          }
          Write-Host "----"
          Write-Host "Weak suites (3DES / NULL / RC4 / SHA-1 CBC): $($weak.Count)"
          if ($weak.Count -gt 0) {
            $weak | Select-Object Name, Protocols | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          }

          New-Item -ItemType Directory -Path survey-results -Force | Out-Null
          $suites | ConvertTo-Json -Depth 3 |
            Set-Content -Path "survey-results/cipher-suites-${{ matrix.os }}.json" -Encoding utf8

      - name: Upload survey results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tls-cipher-suite-survey-${{ matrix.os }}
          path: survey-results/
          if-no-files-found: warn
