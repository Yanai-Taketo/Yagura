name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一 PR への連続 push では古い run を自動キャンセルする(Actions 時間の節約)。
# main への push はキャンセルしない(コミットごとの完全な実行記録を残す)。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 推奨環境の 1 つ目（ADR-0024 決定 1）。**ラベルは明示ピンにする**——`windows-latest` は
  # GitHub 側の都合で指す OS が動くため、推奨区分として何を踏んでいるかが暗黙になる。
  # 実際、以前 `windows-latest` が Server 2022 だった頃の基準値が残ったまま実体が 2025 へ移り、
  # 「推奨に挙げた Server 2022 がどのジョブでも踏まれていない」状態が生まれた（同 ADR 文脈節）。
  # 明示ピンなら、推奨区分を変えるときに本ファイルも必ず直すことになり、ずれが沈黙しない。
  # 将来 OS への追従は build-and-test-latest（カナリア）が別途担う。
  #
  # ジョブ名は変えない——conventions.md が定めるブランチ保護の必須ステータスチェックが
  # `build-and-test` のため。
  build-and-test:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # SQL Server 適合テスト（M5-3。Issue #47）の CI 実行手段。
      #
      # 実体検証（確認日 2026-07-05）: actions/runner-images の Windows2022-Readme.md を直接確認した。
      # 「Installed Software > Databases」節は PostgreSQL・MongoDB のみを standalone サービスとして
      # 掲載しており、SQL Server / LocalDB は掲載されない。一方「Visual Studio Enterprise 2022」の
      # ワークロード構成要素として Microsoft.VisualStudio.Component.SQL.LocalDB.Runtime が含まれる
      # （バージョン 17.14.36510.44）。これは VS のコンポーネントであり、独立した保証ではない。
      #
      # actions/runner-images issue #3691「Add SQL Server Express LocalDB」のメンテナ回答が
      # 明確な結論を与える: sqllocaldb.exe の存在は保証せず、`sqllocaldb info MSSQLLocalDB` で
      # 確認し、無ければ公式 MSI（SqlLocalDB.msi）をその場でダウンロード・サイレントインストール
      # する防御的パターンを推奨している。本ステップはそのパターンをそのまま採用する
      # （代替候補として検討した potatoqualitee/mssqlsuite アクションは不採用——本製品が必要と
      # するのは LocalDB のみであり、追加の外部アクション依存を増やすほどの利益がないため、
      # Microsoft 公式 MSI を直接叩く最小構成を選んだ）。
      - name: Ensure SQL Server LocalDB is available
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "Checking for existing MSSQLLocalDB instance..."
          $instanceExists = & sqllocaldb info MSSQLLocalDB 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $instanceExists) {
            Write-Host "MSSQLLocalDB not found. Downloading official SqlLocalDB.msi..."
            Import-Module BitsTransfer
            Start-BitsTransfer -Source https://download.microsoft.com/download/7/c/1/7c14e92e-bdcb-4f89-b7cf-93543e7112d1/SqlLocalDB.msi -Destination SqlLocalDB.msi
            Write-Host "Installing SqlLocalDB.msi..."
            Start-Process -FilePath "SqlLocalDB.msi" -Wait -ArgumentList "/qn", "/norestart", "/l*v SqlLocalDBInstall.log", "IACCEPTSQLLOCALDBLICENSETERMS=YES"
          } else {
            Write-Host "MSSQLLocalDB instance already registered."
          }

          Write-Host "Starting MSSQLLocalDB instance..."
          # sqllocaldb.exe はネイティブ実行ファイルであり -ErrorAction は使えない
          # （PowerShell コマンドレット専用のパラメータのため）。インスタンスが既に存在する場合の
          # "create" の失敗は無視してよいため、終了コードを見ずに実行を続ける。
          sqllocaldb create MSSQLLocalDB
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      # CI 回帰ベンチ（M7-3。Issue #62。architecture.md §5.2）。
      #
      # 代表シナリオの短縮版を 2 本走らせ、tools/Yagura.Bench/baselines/ci-baseline.json の
      # 基準値と比較する（絶対値の合否は行わない——§5.2「CI の回帰判定は基準比とする」）。
      # レートは開発機ではなく CI ランナー（windows-latest）の性能を前提に控えめに設定する
      # （目安 5k/s。ランナー性能は開発機と別物のため）。追加時間の目安は 2〜3 分
      # （SustainedZeroDrop 10 秒 + ProviderWriteCeiling(SQLite) 8 秒の負荷時間本体 + 起動/停止/
      # ビルド出力コピー等のオーバーヘッド）。
      #
      # 判定モードは M-5 v2（2026-07-06。CI 7 標本。一次データ:
      # tools/Yagura.Bench/results/2026-07-06-ci-windows-latest-m5/）で確定済み:
      # GitHub ホストランナーはランナー個体差（ディスク性能）が支配的で、比判定は両シナリオとも
      # blocking にできない（第 7 標本 run 28754273026 で ProviderWriteCeiling の保存率 22.4% を
      # 観測——突合は成立しており製品は正常。初版の帯 0.15 は同一個体 5 標本の誤較正だった）。
      # blocking は突合成立（送信数 = 保存 + 全カウンタ）のみ。数値は情報記録として artifact に残す。
      # 性能退行の blocking 検知は M-6（基準環境での絶対値判定）の管轄。
      # 帯・判定モードの変更手続きは conventions.md「CI 回帰ベンチの基準値更新」節。
      #
      # グレースフル停止（Ctrl+C 経由。ConsoleCtrlSender）は CI のようなコンソールを持たない
      # 実行環境では機能しない可能性がある。その場合は Yagura.Bench.HostProcess.BenchHostProcess が
      # Kill にフォールバックする——本回帰ベンチが使う 2 シナリオはいずれも「送信数 = 保存件数」の
      # 単純な等式（破棄・退避ゼロ想定）であり、drain 完了後に停止する設計のため、Kill
      # フォールバックが発生してもカウンタの取りこぼしは判定に影響しない（M7-1 の煙テストで
      # 確認済みの前例と同じ考え方）。
      - name: Regression bench (SustainedZeroDrop)
        run: >
          dotnet tools/Yagura.Bench/bin/Release/net10.0/Yagura.Bench.dll
          SustainedZeroDrop --transport udp --rate 5000 --duration 10
          --output-dir bench-results
          --compare-baseline tools/Yagura.Bench/baselines/ci-baseline.json

      - name: Regression bench (ProviderWriteCeiling / SQLite)
        run: >
          dotnet tools/Yagura.Bench/bin/Release/net10.0/Yagura.Bench.dll
          ProviderWriteCeiling --rate 3000 --duration 8
          --output-dir bench-results
          --compare-baseline tools/Yagura.Bench/baselines/ci-baseline.json

      - name: Upload regression bench results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-bench-results
          path: bench-results/
          if-no-files-found: ignore

  # 推奨環境の 2 つ目（ADR-0024 決定 1・決定 5）。本ジョブが無いと Server 2022 は踏まれない。
  #
  # build-and-test を matrix 化せず別ジョブにしたのは、matrix 化すると job 名が
  # `build-and-test (windows-latest)` へ変わり、ブランチ保護の必須ステータスチェック
  # （conventions.md の `build-and-test`）が外れるため。別ジョブなら既存の必須チェック名を
  # 保ったまま Server 2022 の信号を足せる（リポジトリ設定の変更を伴わず、外部貢献者の PR だけで
  # 完結する形を優先した）。本ジョブ自体を必須チェックにするかはリポジトリ設定の判断。
  #
  # 回帰ベンチは本ジョブでは走らせない。基準値ファイルは 1 本（ランナー OS 別の区分を持たない）
  # であり、そこへ 2 つの OS の分布を混ぜると M-5 v2 が診断した分布混合による誤較正を再現する。
  # ベンチの blocking 判定は突合成立のみで、これは全標本で成立した OS 非依存の機能保証である
  # （architecture.md §5.2）。したがって OS を増やす価値は build・単体テスト側にある。
  build-and-test-server2022:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # SQL Server 適合テストの実行手段（本ファイル冒頭のジョブと同じ防御的パターン。
      # ランナー image は LocalDB の存在を保証しないため、無ければ公式 MSI を導入する）。
      - name: Ensure SQL Server LocalDB is available
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $instanceExists = & sqllocaldb info MSSQLLocalDB 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $instanceExists) {
            Import-Module BitsTransfer
            Start-BitsTransfer -Source https://download.microsoft.com/download/7/c/1/7c14e92e-bdcb-4f89-b7cf-93543e7112d1/SqlLocalDB.msi -Destination SqlLocalDB.msi
            Start-Process -FilePath "SqlLocalDB.msi" -Wait -ArgumentList "/qn", "/norestart", "/l*v SqlLocalDBInstall.log", "IACCEPTSQLLOCALDBLICENSETERMS=YES"
          }

          sqllocaldb create MSSQLLocalDB
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

  # 将来 OS のカナリア。推奨環境の表明（ADR-0024 決定 1）とは目的が別で、**何かを約束する
  # ジョブではない**——GitHub が `windows-latest` を次の Windows Server へ移したときに、
  # 非互換を「推奨区分へ入れる前に」検知するための先行警告である。
  #
  # 必須ステータスチェックにはしない: ここが落ちても、それは Yagura が対応を表明していない
  # OS の話であり、リリースを止める理由にならない。赤は「次の OS で困りそうな兆候が出た」
  # という調査の合図として扱う（continue-on-error は使わない——緑に見えると兆候が埋もれる）。
  #
  # 現在 `windows-latest` は Server 2025 を指すため build-and-test と実体が重複する。
  # 本ジョブの価値は GitHub がラベルを移した日から生じる。重複期間のコストを許容できないと
  # 判断した場合は、本ジョブだけを削ればよい（推奨環境の被覆は明示ピンの 2 ジョブが持つ）。
  #
  # ベンチを走らせないのは build-and-test-server2022 と同じ理由（基準値は 1 本で OS 別の
  # 区分を持たず、分布を混ぜると M-5 v2 の誤較正を再現するため）。
  build-and-test-latest:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Ensure SQL Server LocalDB is available
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $instanceExists = & sqllocaldb info MSSQLLocalDB 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $instanceExists) {
            Import-Module BitsTransfer
            Start-BitsTransfer -Source https://download.microsoft.com/download/7/c/1/7c14e92e-bdcb-4f89-b7cf-93543e7112d1/SqlLocalDB.msi -Destination SqlLocalDB.msi
            Start-Process -FilePath "SqlLocalDB.msi" -Wait -ArgumentList "/qn", "/norestart", "/l*v SqlLocalDBInstall.log", "IACCEPTSQLLOCALDBLICENSETERMS=YES"
          }

          sqllocaldb create MSSQLLocalDB
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build
