name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一 PR への連続 push では古い run を自動キャンセルする(Actions 時間の節約)。
# main への push はキャンセルしない(コミットごとの完全な実行記録を残す)。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 推奨環境（ADR-0024 決定 1）の全バージョンでビルド・単体テストを行う。
  #
  # ■ ランナーラベルは明示ピンにする
  # `windows-latest` は GitHub の都合で指す OS が動くため、推奨区分として何を踏んでいるかが
  # 暗黙になる。実際これは一度起きている——`windows-latest` が Server 2022 だった頃の基準値が
  # 残ったまま実体が 2025 へ移り、「推奨に挙げた Server 2022 がどのジョブでも踏まれていない」
  # 状態が生まれた。明示ピンなら推奨区分を変えるときに本ファイルも必ず直すことになり、
  # ずれが沈黙しない。将来 OS への追従は build-and-test-canary が別の目的として担う。
  #
  # ■ 新しい OS を推奨区分へ加える手順（保守手順。ADR-0024 決定 5）
  #   1. ADR-0024 決定 1 の表を更新する（推奨区分の定義が正）
  #   2. 下の matrix へ 1 行足す
  #   3. installer-e2e.yml の matrix へ 1 行足す
  #   4. 外すときは同じ 3 か所から削る
  # ブランチ保護の設定変更は要らない——必須チェックは末尾の集約ジョブ build-and-test に
  # 固定されており、ゲートの構成は needs（= 本ジョブ全体）で表現されるため、matrix の増減に
  # 自動的に追随する。
  build-and-test-recommended:
    strategy:
      # 片方の失敗でもう片方を打ち切らない（どの OS で落ちたかを 1 回の run で知りたい）。
      fail-fast: false
      matrix:
        include:
          # bench: 回帰ベンチを担当する OS を 1 つだけ true にする。基準値ファイルは 1 本で
          # ランナー OS 別の区分を持たず、複数 OS の分布を混ぜると M-5 v2 が実測で診断した
          # 分布混合による誤較正を再現するため（architecture.md §5.2）。担当 OS を移すときは
          # conventions.md「CI 回帰ベンチの基準値更新」の手続きで再較正すること。
          - os: windows-2025
            bench: true
          - os: windows-2022
            bench: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test
        uses: ./.github/actions/windows-build-test

      # CI 回帰ベンチ（M7-3。architecture.md §5.2）。
      #
      # 代表シナリオの短縮版を 2 本走らせ、tools/Yagura.Bench/baselines/ci-baseline.json の
      # 基準値と比較する（絶対値の合否は行わない——§5.2「CI の回帰判定は基準比とする」）。
      # レートは CI ランナーの性能を前提に控えめに設定する（目安 5k/s）。追加時間の目安は 2〜3 分。
      #
      # 判定モードは M-5 v2 で確定済み: GitHub ホストランナーはランナー個体差（ディスク性能）が
      # 支配的で、比判定は両シナリオとも blocking にできない。blocking は突合成立
      # （送信数 = 保存 + 全カウンタ）のみ。数値は情報記録として artifact に残す。
      # 性能退行の blocking 検知は M-6（基準環境での絶対値判定）の管轄。
      #
      # グレースフル停止（Ctrl+C 経由）はコンソールを持たない実行環境では機能しない可能性があり、
      # その場合は Kill にフォールバックする——本回帰ベンチの 2 シナリオはいずれも
      # 「送信数 = 保存件数」の単純な等式（破棄・退避ゼロ想定）で drain 完了後に停止する設計のため、
      # フォールバックが発生してもカウンタの取りこぼしは判定に影響しない。
      - name: Regression bench (SustainedZeroDrop)
        if: matrix.bench
        run: >
          dotnet tools/Yagura.Bench/bin/Release/net10.0/Yagura.Bench.dll
          SustainedZeroDrop --transport udp --rate 5000 --duration 10
          --output-dir bench-results
          --compare-baseline tools/Yagura.Bench/baselines/ci-baseline.json

      - name: Regression bench (ProviderWriteCeiling / SQLite)
        if: matrix.bench
        run: >
          dotnet tools/Yagura.Bench/bin/Release/net10.0/Yagura.Bench.dll
          ProviderWriteCeiling --rate 3000 --duration 8
          --output-dir bench-results
          --compare-baseline tools/Yagura.Bench/baselines/ci-baseline.json

      - name: Upload regression bench results
        if: always() && matrix.bench
        uses: actions/upload-artifact@v7
        with:
          name: regression-bench-results
          path: bench-results/
          if-no-files-found: ignore

  # 将来 OS のカナリア。推奨環境の表明（ADR-0024 決定 1）とは目的が別で、**何かを約束する
  # ジョブではない**——GitHub が `windows-latest` を次の Windows Server へ移したときに、
  # 非互換を「推奨区分へ入れる前に」検知するための先行警告である。
  #
  # ゲート（集約ジョブ build-and-test の needs）には含めない: ここが落ちても、それは Yagura が
  # 対応を表明していない OS の話であり、リリースを止める理由にならない。赤は「次の OS で
  # 困りそうな兆候が出た」という調査の合図として扱う（continue-on-error は使わない——
  # 緑に見えると兆候が埋もれるため、赤いまま非 blocking にする）。
  #
  # 現在 `windows-latest` は Server 2025 を指すため推奨区分の 1 つと実体が重複する。
  # 本ジョブの価値は GitHub がラベルを移した日から生じる。重複コストが見合わないと判断した
  # 場合は本ジョブだけを削ればよい（推奨環境の被覆は明示ピンの matrix が持つ）。
  #
  # ベンチを走らせないのは基準値ファイルが 1 本であるため（上記 matrix の bench 参照）。
  build-and-test-canary:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test
        uses: ./.github/actions/windows-build-test

  # ブランチ保護の必須ステータスチェックの受け口（conventions.md が名指しする `build-and-test`）。
  #
  # ■ なぜ集約ジョブを挟むか
  # 必須チェックは「ジョブ名」で指定され、その設定はリポジトリ設定（オーナー専有）にある。
  # 実作業ジョブを直接指定すると、OS の増減やジョブ名の変更のたびにリポジトリ設定の更新が要り、
  # 忘れると黙ってゲートが外れる。本ジョブを固定の受け口にすることで、**ゲートの構成
  # （何の成功を要求するか）を workflow ファイル側に置ける**——変更は PR だけで完結し、
  # 外部貢献者も推奨区分の増減に追随できる。
  #
  # 対象は推奨区分のみ（ADR-0024 決定 1 が「全機能」を約束する範囲）。カナリアは含めない。
  build-and-test:
    needs: build-and-test-recommended
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify recommended-environment jobs succeeded
        shell: bash
        run: |
          result='${{ needs.build-and-test-recommended.result }}'
          echo "build-and-test-recommended: $result"
          # skipped / cancelled も success 以外として扱う——依存が走らなかったことを
          # 「通った」と誤認させない。matrix の 1 つでも失敗すれば result は success にならない。
          if [ "$result" != "success" ]; then
            echo "推奨環境のジョブが success ではありません。" >&2
            exit 1
          fi
