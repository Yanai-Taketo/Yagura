# インストーラ E2E(M9-2。Issue #75): ゼロ設定ファーストランの証拠(ADR-0006 基準 1)。
#
# MSI をビルドし、GitHub ホストランナー上で実際にサイレントインストール →
# サービス起動 → UDP 514 受信 → 閲覧リスナ(8514)照合 → アンインストール →
# 残置物確認までを installer/e2e/Invoke-YaguraInstallerE2E.ps1 で実行する。
#
# トリガ設計(CI 時間への配慮):
#   - pull_request は installer/ 配下(+ 本 workflow 自身)の変更時のみ。
#     src/ 側の変更はビルド・テスト・回帰ベンチを ci.yml が検証しており、
#     本 workflow は MSI の構造・インストール挙動の検証に特化する
#   - 依存バージョンの集中管理ファイルも対象に含める(Issue #347)。MSI は
#     Yagura.Host の publish 出力を丸ごとハーベストするため、依存の更新は
#     MSI に収まるファイルの構成・バージョン資源をそのまま変える。ci.yml は
#     ビルドとテストが通ることしか見ておらず MSI をビルドしないため、
#     依存更新だけの PR は本 workflow を通さないと MSI 側の破壊を検出できない。
#     実例: Dependabot #328 の SQLitePCLRaw.lib.e_sqlite3 3.50.3 → 3.53.3 が
#     ICE60 で MSI ビルドを落としたが、本 workflow が走らず main へ入った
#   - workflow_dispatch で任意時点の実行(リリース前の証拠採取等)を可能にする
#
# ci.yml には触れない(並行 PR との衝突回避。M9-1 からの方針)。
name: Installer E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'installer/**'
      - '.github/workflows/installer-e2e.yml'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'

permissions:
  contents: read

# 同一 PR への連続 push では古い run を自動キャンセルする(Actions 時間の節約。
# ci.yml と同じ設計。workflow_dispatch はキャンセル対象にしない)。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer-e2e:
    # 推奨環境の 2 バージョン（ADR-0024 決定 1）を両方踏む。OS バージョン差が最も現れるのは
    # Windows サービス登録・ACL・MSI の起動条件といった本 workflow の検証面であり、
    # ci.yml のビルド・単体テストでは被覆がほとんど増えない（同決定 5）。
    # 本 workflow は paths フィルタ付きで必須ステータスチェックではないため、matrix 化しても
    # ブランチ保護の設定に影響しない（ci.yml 側を別ジョブにしたのはこの差による）。
    #
    # ラベルは ci.yml と同じく明示ピンにする（`windows-latest` は指す OS が動くため、推奨区分と
    # して何を踏んでいるかが暗黙になる）。将来 OS のカナリアは ci.yml 側の
    # build-and-test-latest が担い、本 workflow には置かない——1 実行 30 分規模のため、
    # `windows-latest` が現在 Server 2025 を指す間は純粋な重複コストになる。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # MSI ビルド(installer/README.md の手順と同一)。内部で Yagura.Host を
      # self-contained (win-x64) で publish してから WiX が焼く。本ワークフローは
      # x64 専用のまま維持する(ADR-0009 決定5「installer-e2e.yml 相当の重い E2E は
      # 当面 x64 のみに残す」)。ARM64 は .github/workflows/release.yml の smoke-arm64
      # ジョブ(windows-11-arm 実アーキ)が担う。
      - name: Build MSI
        run: dotnet build installer/Yagura.Installer.wixproj -c Release -p:YaguraArch=x64

      # 「版だけ新しく中身が旧版」の MSI を落とす（Issue #514）。
      #
      # wixproj は publish を別プロセスで起動するため、-p:YaguraVersion の上書きが
      # publish 側へ届かない時期があった。その MSI でアップグレードすると、MSI の
      # ファイル版数規則で上書きが起きず、**新しいコードを 1 バイトも載せないまま
      # インストールが成功する**（"Existing file is of an equal version"）。
      # 成功して見えるのが厄介で、lab の手動検証を長く無効化していた。
      #
      # MSI の ProductVersion と収録アセンブリの FileVersion が一致することを検査する。
      # -p:YaguraVersion を明示して両者がともに追随することを確かめるため、**既定値とは
      # 違う版**でビルドし直して比べる（既定値のままだと、渡らなくても一致してしまい
      # 検査が空振りする）。
      - name: Verify the MSI version reaches the published assemblies
        shell: pwsh
        run: |
          $probeVersion = '9.9.9'
          dotnet build installer/Yagura.Installer.wixproj -c Release -p:YaguraArch=x64 `
            -p:YaguraVersion=$probeVersion `
            -p:BaseOutputPath=bin/versionprobe/ -p:BaseIntermediateOutputPath=obj/versionprobe/
          if ($LASTEXITCODE -ne 0) { throw "version probe build failed" }

          $msi = Get-ChildItem -Path installer/bin/versionprobe -Recurse -Filter Yagura-*.msi | Select-Object -First 1
          if ($null -eq $msi) { throw 'version probe MSI not found' }

          # MSI の ProductVersion を読む（WindowsInstaller COM）。
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi.FullName, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db,
            @("SELECT Value FROM Property WHERE Property='ProductVersion'"))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
          $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          $productVersion = $record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, 1)

          # 収録アセンブリ（publish 出力）の FileVersion を読む。
          $hostExe = Get-ChildItem -Path installer/bin/versionprobe -Recurse -Filter Yagura.Host.exe |
            Select-Object -First 1
          if ($null -eq $hostExe) {
            $hostExe = Get-ChildItem -Path installer -Recurse -Filter Yagura.Host.exe | Select-Object -First 1
          }
          if ($null -eq $hostExe) { throw 'Yagura.Host.exe not found for version comparison' }
          $fileVersion = (Get-Item $hostExe.FullName).VersionInfo.FileVersion

          Write-Host "MSI ProductVersion : $productVersion"
          Write-Host "Assembly FileVersion: $fileVersion"

          if (-not $productVersion.StartsWith($probeVersion)) {
            throw "MSI ProductVersion ($productVersion) does not reflect -p:YaguraVersion ($probeVersion)."
          }
          if (-not $fileVersion.StartsWith($probeVersion)) {
            throw "Assembly FileVersion ($fileVersion) does not reflect -p:YaguraVersion ($probeVersion). " +
                  "The MSI would ship old binaries under a new version (Issue #514)."
          }

      # アップグレード元 MSI(ADR-0023 決定 2 の採否条件②。Issue #467):
      # Schedule="afterInstallExecute" では**新サービスを起動した後に旧製品のアンインストールが
      # 走る**ため、コンポーネント参照カウントが崩れていれば起動したばかりの新サービスが
      # 止められ・消される。これは authoring の照合では確かめられず、**実際にアップグレードして
      # 新サービスが動き続けていること**を見るしかない。そのために「現行より古いバージョン」の
      # MSI をもう 1 本焼く。
      #
      # 版だけを下げた同一ツリーのビルドである点は承知のうえで採る——真の旧版(過去のリリース
      # 成果物)を引いてくる形は、①リリースが存在しない開発初期に成立せず、②fork からの PR で
      # 外部成果物の取得に依存し、③「その版のコンポーネント GUID」を検証対象にしてしまう。
      # ここで検証したいのは「参照カウントが版間で保たれるか」であり、版番号以外を変えないほうが
      # 判定が鋭くなる(GUID の版間安定性そのものは ADR-0023 委任 2 の実測で別途確認済み)。
      #
      # 出力を上書きしないよう別ディレクトリへ焼く。**obj も必ず分ける**——同一作業ツリーで
      # 版だけ変えて連続ビルドすると、MSBuild の増分判定が installer/obj のキャッシュを誤って
      # 再利用し、2 本目に 1 本目の版が混ざる(installer/README.md が記録している既知の問題。
      # 本 PR の実装中に開発機でも実際に踏み、clean 後は正しい版になることを確認した)。
      # 出力先を bin/ ・obj/ の**配下**に置くのは、リポジトリの .gitignore が [Bb]in/ ・
      # [Oo]bj/ しか無視しないため——bin-prev/ のような兄弟ディレクトリを作ると
      # ビルド成果物が未追跡ファイルとして現れる。
      - name: Build previous-version MSI (upgrade source)
        run: >
          dotnet build installer/Yagura.Installer.wixproj -c Release -p:YaguraArch=x64
          -p:YaguraVersion=0.0.1
          -p:SkipYaguraHostPublish=true
          -p:BaseOutputPath=bin/prev/
          -p:BaseIntermediateOutputPath=obj/prev/

      # 管理者権限の根拠(実体検証済みの公式記載):
      # GitHub 公式ドキュメント「GitHub-hosted runners reference」の
      # 「Administrative privileges」節(docs.github.com/en/actions/reference/
      # runners/github-hosted-runners、確認日 2026-07-06)に次の記載がある:
      #   "Windows virtual machines are configured to run as administrators with
      #    User Account Control (UAC) disabled."
      # したがって msiexec /qn(per-machine サイレントインストール)は昇格プロンプト
      # なしで実行できる見込み。ただしサービス起動(仮想サービスアカウント
      # NT SERVICE\Yagura)を含む実挙動はここで初めて実体検証される(Issue #75:
      # 成立しない場合は lab 手順書 + 開発機実行の記録方式へ縮退し、判断を PR に残す)。
      #
      # 検証・照合は ASCII トークン(RunId)のみで行う(en-US ランナーの
      # コードページ CP437 で日本語照合が文字化けする——スクリプト内コメント参照)。
      - name: Run installer E2E
        shell: pwsh
        run: |
          # MSI パスは実出力から解決する(既定は installer/bin/Release/ja-JP/Yagura-x64.msi。
          # ADR-0009 決定4 で成果物命名にアーキサフィックスが付いた——WiX SDK の出力パス構成の
          # 変化にも頑健にするため Filter は "Yagura-*.msi" のワイルドカードにする)。
          # 探索先を installer/bin/Release に限定する(installer/bin 全体を再帰すると
          # アップグレード元の installer/bin/prev/... を掴みうる——そうなると「同じ版へ
          # アップグレードする」無意味な検証になり、しかも緑になる)。
          $msi = Get-ChildItem -Path installer/bin/Release -Recurse -Filter Yagura-*.msi |
            Select-Object -First 1
          if ($null -eq $msi) {
            throw 'Yagura-*.msi not found under installer/bin/Release'
          }
          Write-Host "MSI: $($msi.FullName)"
          # アップグレード元(古い版)。見つからない場合はここで落とす——黙ってスキップすると
          # ADR-0023 決定 2 の採否条件②が検証されないまま緑になる。
          $prev = Get-ChildItem -Path installer/bin/prev -Recurse -Filter Yagura-*.msi -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $prev) {
            throw 'previous-version Yagura-*.msi not found under installer/bin/prev (upgrade verification would be silently skipped)'
          }
          Write-Host "Upgrade-from MSI: $($prev.FullName)"
          ./installer/e2e/Invoke-YaguraInstallerE2E.ps1 `
            -MsiPath $msi.FullName `
            -UpgradeFromMsiPath $prev.FullName `
            -OutputDir 'e2e-results'

      # 対応 OS 下限の LaunchCondition(ADR-0024 決定 6。Issue #496)が**何を根拠に判定したか**を
      # 実ビルドの msiexec ログから採取する。
      #
      # ここが要る理由: 条件式が誤ると**全対応環境でインストールとアップグレードが拒否される**。
      # 上のステップが成功していること自体が「推奨区分は通る」証拠だが、それは
      # 「条件が正しい」からなのか「プロパティが読めず fail-open で通った」からなのかを
      # 区別しない。**実際に読めた値**を記録して初めて、判定が効いていることを言える。
      # 併せて VersionNT / WindowsBuild も出す——これらを使わなかった判断
      # （Package.wxs のコメント参照）が実測で裏付けられるかを残すため。
      - name: Record OS gate properties from the MSI log
        if: always()
        shell: pwsh
        run: |
          $log = 'e2e-results/msiexec-install.log'
          if (-not (Test-Path $log)) {
            Write-Host "::warning::$log not found; skipping OS gate property report"
            exit 0
          }
          # msiexec の詳細ログは UTF-16LE。Select-String の既定では読めない。
          $lines = Get-Content $log -Encoding Unicode
          foreach ($name in 'YAGURA_OS_BUILD', 'VersionNT', 'VersionNT64', 'WindowsBuild') {
            $hit = $lines | Select-String -SimpleMatch "Property(S): $name = " | Select-Object -First 1
            if ($null -eq $hit) { $hit = $lines | Select-String -SimpleMatch "Property(C): $name = " | Select-Object -First 1 }
            if ($null -eq $hit) {
              Write-Host "  $name = (not present in log)"
            } else {
              Write-Host ("  " + $hit.Line.Trim())
            }
          }

      # 証拠 artifact(ADR-0006 基準 1): 人間可読ログ(*.log.txt)+ 機械可読サマリ
      # (*.summary.json)+ msiexec 詳細ログ。失敗時も必ず残す(失敗の記録も証拠)。
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # matrix の各 OS で衝突しないよう名前を分ける（同名だとアップロードが失敗する）。
          name: installer-e2e-results-${{ matrix.os }}
          path: e2e-results/
          if-no-files-found: warn
